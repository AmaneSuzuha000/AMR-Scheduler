# Explicit metric DWB profile. Python retains global routing and reservations.
# Research tuning; hardware parameters and factory-wide coverage remain unverified.
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    odom_topic: /odometry/filtered
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.1
      movement_time_allowance: 20.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.02
      yaw_goal_tolerance: 0.2
    FollowPath:
      plugin: nav2_rotation_shim_controller::RotationShimController
      debug_trajectory_details: false
      transform_tolerance: 0.2
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.2
      max_vel_y: 0.0
      max_vel_theta: 0.8
      min_speed_xy: 0.0
      max_speed_xy: 0.2
      min_speed_theta: 0.0
      acc_lim_x: 0.4
      acc_lim_y: 0.0
      acc_lim_theta: 1.0
      decel_lim_x: -0.4
      decel_lim_y: 0.0
      decel_lim_theta: -1.0
      vx_samples: 10
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.5
      discretize_by_time: true
      time_granularity: 0.05
      linear_granularity: 0.025
      angular_granularity: 0.025
      xy_goal_tolerance: 0.02
      trans_stopped_velocity: 0.01
      short_circuit_trajectory_evaluation: true
      stateful: true
      prune_plan: true
      prune_distance: 2.0
      forward_prune_distance: 2.0
      shorten_transformed_plan: true
      publish_evaluation: false
      publish_trajectories: false
      critics:
      - RotateToGoal
      - Oscillation
      - ObstacleFootprint
      - PathAlign
      - GoalAlign
      - PathDist
      - GoalDist
      - amr_execution::ContinuousGoalDist
      ObstacleFootprint.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      primary_controller: dwb_core::DWBLocalPlanner
      angular_dist_threshold: 0.25
      angular_disengage_threshold: 0.1
      forward_sampling_distance: 0.35
      rotate_to_heading_angular_vel: 0.8
      max_angular_accel: 1.0
      simulate_ahead_time: 1.5
      rotate_to_goal_heading: true
      closed_loop: false
      amr_execution::ContinuousGoalDist.scale: 12.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 10.0
      publish_frequency: 5.0
      always_send_full_costmap: true
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      footprint: '[[-0.315,-0.252],[0.315,-0.252],[0.315,0.252],[-0.315,0.252]]'
      footprint_padding: 0.02
      transform_tolerance: 0.2
      plugins:
      - obstacle_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          expected_update_rate: 0.3
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          obstacle_max_range: 7.5
          raytrace_max_range: 8.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.5
