# Known synthetic metric map + encoder forward speed + IMU yaw rate + laser.
# No Gazebo model state, world odometry, or IMU absolute yaw enters estimation.
ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 50.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom
    odom0: /wheel/odometry
    # x y z roll pitch yaw vx vy vz vroll vpitch vyaw ax ay az
    # Do not constrain lateral slip to zero; do not trust encoder skid yaw.
    odom0_config: [false, false, false, false, false, false,
                   true, false, false, false, false, false, false, false, false]
    odom0_queue_size: 10
    imu0: /imu/data
    imu0_config: [false, false, false, false, false, false,
                  false, false, false, false, false, true, false, false, false]
    imu0_queue_size: 20
    imu0_remove_gravitational_acceleration: false

map_server:
  ros__parameters:
    use_sim_time: true
    frame_id: map
    topic_name: map

amcl:
  ros__parameters:
    use_sim_time: true
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint
    scan_topic: /scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    tf_broadcast: true
    transform_tolerance: 0.3
    min_particles: 500
    max_particles: 2000
    alpha1: 0.15
    alpha2: 0.15
    alpha3: 0.15
    alpha4: 0.15
    alpha5: 0.15
    laser_model_type: likelihood_field
    laser_max_range: 8.0
    laser_min_range: 0.05
    max_beams: 120
    laser_likelihood_max_dist: 2.0
    z_hit: 0.95
    z_rand: 0.05
    sigma_hit: 0.1
    update_min_d: 0.02
    update_min_a: 0.02
    resample_interval: 1
    set_initial_pose: false
